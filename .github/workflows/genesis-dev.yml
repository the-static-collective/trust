name: genesis-dev

on:
  push:
    branches: ["build/genesis-native-0.1.0"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  task-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Commit generated lockfile
        if: github.event_name == 'push'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Build: lock Genesis dependencies"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Boundary
        run: npm run public-boundary
      - name: Protocol tests if present
        run: npm test --workspace @trust/protocol --if-present
      - name: Protocol typecheck if present
        run: npm run typecheck --workspace @trust/protocol --if-present
      - name: Mobile tests if present
        run: npm test --workspace @trust/mobile --if-present
      - name: Mobile typecheck if present
        run: npm run typecheck --workspace @trust/mobile --if-present
      - name: Expo Android export smoke
        run: npm run export:android --workspace @trust/mobile
      - name: Docs tests if present
        run: node --test scripts/check-docs.test.mjs
      - name: Verification contract
        run: node --test scripts/verify-contract.test.mjs
      - name: Preserve generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-current
          path: package-lock.json
